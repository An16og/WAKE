services:
  - type: web
    name: wake-exe
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start --workspace=server
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMMA_PROVIDER
        value: none # Fallback provider in production unless connected to an OpenAI-compatible/Ollama proxy
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: SENTRY_DSN
        sync: false
